<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /*
      ==========================================
      AR LANDING PAGE
      ==========================================
      */

      #arPage {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        padding: 30px;

        background: #111;
        color: white;

        text-align: center;
        font-family: Arial, sans-serif;
      }

      #arPage h1 {
        margin: 0 0 10px;
        font-size: 30px;
      }

      #arPage p {
        max-width: 320px;
        margin: 0 0 25px;
        line-height: 1.5;
        opacity: 0.75;
      }

      #startAR {
        padding: 16px 35px;

        border: none;
        border-radius: 50px;

        background: white;
        color: black;

        font-size: 17px;
        font-weight: bold;

        cursor: pointer;
      }

      /*
      ==========================================
      STATUS
      ==========================================
      */

      #status {
        position: fixed;
        z-index: 9998;

        top: 20px;
        left: 50%;

        transform: translateX(-50%);

        padding: 10px 18px;

        border-radius: 30px;

        background: rgba(0, 0, 0, 0.7);

        color: white;

        font-family: Arial, sans-serif;
        font-size: 14px;

        display: none;
      }
    </style>
  </head>

  <body>

    <!--
    ================================================
    AR LANDING PAGE
    ================================================
    -->

    <div id="arPage">

      <h1>✨ AR Experience</h1>

      <p>
        Tap Start AR, then point your camera at the card.
      </p>

      <button id="startAR">
        Start AR
      </button>

    </div>


    <!-- STATUS -->

    <div id="status">
      Point your camera at the card
    </div>


    <!--
    ================================================
    MINDAR + A-FRAME
    ================================================
    -->

    <a-scene
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <!--
      ==============================================
      ASSETS
      ==============================================
      -->

      <a-assets>

        <video
          id="arVideo"
          src="video.mp4"
          loop
          playsinline
          webkit-playsinline
          preload="auto"
        ></video>

      </a-assets>


      <!--
      ==============================================
      CAMERA
      ==============================================
      -->

      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
      ></a-camera>


      <!--
      ==============================================
      IMAGE TARGET
      ==============================================
      -->

      <a-entity
        id="target"
        mindar-image-target="targetIndex: 0"
      >


        <!--
        ============================================
        AR CONTENT CONTAINER
        ============================================
        -->

        <a-entity
          id="arObject"
          position="0 0 0"
        >


          <!--
          ==========================================
          BASE
          ==========================================
          -->

          <a-box
            id="base"
            position="0 0.04 0"
            width="1"
            height="0.08"
            depth="0.65"
            color="#eeeeee"
          ></a-box>


          <!-- BASE TOP -->

          <a-box
            position="0 0.085 0"
            width="0.92"
            height="0.025"
            depth="0.58"
            color="#ffffff"
          ></a-box>


          <!--
          ==========================================
          PRODUCT / VIDEO
          ==========================================
          
          The bottom of the video starts
          just above the base.

          Y controls HEIGHT.
          Z controls DEPTH.
          ==========================================
          -->

          <a-entity
            id="product"
            position="0 0.08 0.05"
            rotation="0 0 0"
            scale="1 1 1"
          >

            <a-video
              id="videoPlane"
              src="#arVideo"

              position="0 0.30 0"

              width="0.65"
              height="0.90"

              material="
                shader: flat;
                side: double;
              "
            ></a-video>


            <!--
            ========================================
            LEFT SUPPORT
            ========================================
            -->

            <a-box
              position="-0.36 0.30 -0.02"
              width="0.025"
              height="0.95"
              depth="0.025"
              color="#db4a2b"
            ></a-box>


            <!--
            ========================================
            RIGHT SUPPORT
            ========================================
            -->

            <a-box
              position="0.36 0.30 -0.02"
              width="0.025"
              height="0.95"
              depth="0.025"
              color="#db4a2b"
            ></a-box>


            <!--
            ========================================
            TOP SUPPORT
            ========================================
            -->

            <a-box
              position="0 0.79 -0.02"
              width="0.75"
              height="0.025"
              depth="0.025"
              color="#db4a2b"
            ></a-box>


          </a-entity>


          <!--
          ==========================================
          LIGHT
          ==========================================
          -->

          <a-light
            type="ambient"
            intensity="1.2"
          ></a-light>


          <a-light
            type="point"
            position="0 1.5 0.8"
            intensity="2"
            distance="4"
          ></a-light>


        </a-entity>

      </a-entity>

    </a-scene>


    <script>

      /*
      ==========================================
      ELEMENTS
      ==========================================
      */

      const arPage =
        document.getElementById("arPage");

      const startAR =
        document.getElementById("startAR");

      const status =
        document.getElementById("status");

      const video =
        document.getElementById("arVideo");

      const target =
        document.getElementById("target");

      const product =
        document.getElementById("product");


      /*
      ==========================================
      START AR
      ==========================================
      */

      startAR.addEventListener(
        "click",
        async function () {

          console.log("START AR BUTTON");

          /*
          Hide landing page
          */

          arPage.style.display = "none";


          /*
          Show status
          */

          status.style.display = "block";

          status.textContent =
            "Point your camera at the card";


          /*
          Enable sound
          */

          video.muted = false;


          /*
          Prepare video
          */

          try {

            await video.play();

            video.pause();

            console.log("VIDEO READY");

          } catch (error) {

            console.log(
              "Video preparation:",
              error
            );

          }

        }
      );


      /*
      ==========================================
      TARGET FOUND
      ==========================================
      */

      target.addEventListener(
        "targetFound",
        async function () {

          console.log("TARGET FOUND");


          status.textContent =
            "✓ AR detected";


          /*
          ========================================
          RESET PRODUCT
          ========================================
          */

          product.setAttribute(
            "position",
            "0 0.08 0.05"
          );

          product.setAttribute(
            "rotation",
            "0 0 0"
          );

          product.setAttribute(
            "scale",
            "0.15 0.15 0.15"
          );


          /*
          ========================================
          PRODUCT RISES FROM BASE
          ========================================
          */

          product.setAttribute(
            "animation__rise",
            {
              property: "position",

              from: "0 0.08 0.05",

              to: "0 0.08 0.12",

              dur: 900,

              easing: "easeOutCubic"
            }
          );


          /*
          ========================================
          PRODUCT GROWS
          ========================================
          */

          product.setAttribute(
            "animation__scale",
            {
              property: "scale",

              from: "0.15 0.15 0.15",

              to: "1 1 1",

              dur: 900,

              easing: "easeOutBack"
            }
          );


          /*
          ========================================
          SLIGHT 3D TILT
          ========================================
          */

          product.setAttribute(
            "animation__tilt",
            {
              property: "rotation",

              from: "0 0 0",

              to: "-4 -5 0",

              dur: 900,

              easing: "easeOutCubic"
            }
          );


          /*
          ========================================
          PLAY VIDEO
          ========================================
          */

          video.muted = false;

          try {

            await video.play();

            console.log(
              "VIDEO PLAYING"
            );

          } catch (error) {

            console.error(
              "VIDEO PLAY ERROR:",
              error
            );

          }

        }
      );


      /*
      ==========================================
      TARGET LOST
      ==========================================
      */

      target.addEventListener(
        "targetLost",
        function () {

          console.log(
            "TARGET LOST"
          );


          status.textContent =
            "Point your camera at the card";


          /*
          Pause video
          */

          video.pause();


          /*
          ========================================
          PRODUCT GOES BACK INTO BASE
          ========================================
          */

          product.setAttribute(
            "animation__hide",
            {
              property: "scale",

              from: "1 1 1",

              to: "0.15 0.15 0.15",

              dur: 450,

              easing: "easeInCubic"
            }
          );


          product.setAttribute(
            "animation__hidePosition",
            {
              property: "position",

              from: "0 0.08 0.12",

              to: "0 0.08 0.05",

              dur: 450,

              easing: "easeInCubic"
            }
          );

        }
      );

    </script>

  </body>
</html>
