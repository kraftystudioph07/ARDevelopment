<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /*
      ==========================================
      AR LANDING PAGE
      ==========================================
      */

      #arPage {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        padding: 30px;

        background: #111;
        color: white;

        text-align: center;
        font-family: Arial, sans-serif;
      }

      #arPage h1 {
        margin: 0 0 10px;
        font-size: 30px;
      }

      #arPage p {
        max-width: 320px;
        margin: 0 0 25px;
        line-height: 1.5;
        opacity: 0.75;
      }

      #startAR {
        padding: 16px 35px;

        border: none;
        border-radius: 50px;

        background: white;
        color: black;

        font-size: 17px;
        font-weight: bold;

        cursor: pointer;
      }

      /*
      ==========================================
      STATUS
      ==========================================
      */

      #status {
        position: fixed;
        z-index: 9998;

        top: 20px;
        left: 50%;

        transform: translateX(-50%);

        padding: 10px 18px;

        border-radius: 30px;

        background: rgba(0, 0, 0, 0.7);

        color: white;

        font-family: Arial, sans-serif;
        font-size: 14px;

        display: none;
      }
    </style>
  </head>

  <body>

    <!-- ========================================
         AR PAGE
    ========================================= -->

    <div id="arPage">

      <h1>✨ AR Experience</h1>

      <p>
        Tap Start AR, then point your camera at the card.
      </p>

      <button id="startAR">
        Start AR
      </button>

    </div>


    <!-- STATUS -->

    <div id="status">
      Point your camera at the card
    </div>


    <!-- ========================================
         MINDAR
    ========================================= -->

    <a-scene
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <!-- ======================================
           VIDEO ASSET
      ======================================= -->

      <a-assets>

        <video
          id="arVideo"
          src="video.mp4"
          loop
          playsinline
          webkit-playsinline
          preload="auto"
          muted
        ></video>

      </a-assets>


      <!-- ======================================
           CAMERA
      ======================================= -->

      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
      ></a-camera>


      <!-- ======================================
           TARGET
      ======================================= -->

      <a-entity
        id="target"
        mindar-image-target="targetIndex: 0"
      >

        <a-video
          id="videoPlane"
          src="#arVideo"
          position="0 0 0.1"
          width="1"
          height="0.5625"
        ></a-video>

      </a-entity>

    </a-scene>


    <script>

      /*
      ==========================================
      ELEMENTS
      ==========================================
      */

      const arPage =
        document.getElementById("arPage");

      const startAR =
        document.getElementById("startAR");

      const status =
        document.getElementById("status");

      const video =
        document.getElementById("arVideo");

      const target =
        document.getElementById("target");


      /*
      ==========================================
      STATE
      ==========================================
      */

      let arStarted = false;


      /*
      ==========================================
      START AR
      ==========================================
      */

      startAR.addEventListener(
        "click",
        function () {

          console.log(
            "START AR BUTTON"
          );


          /*
          Enable AR
          */

          arStarted = true;


          /*
          Hide landing page
          */

          arPage.style.display = "none";


          /*
          Show status
          */

          status.style.display = "block";

          status.textContent =
            "Point your camera at the card";


          /*
          Keep video muted initially.

          The click has now happened, so the
          browser allows us to control the video.
          */

          video.muted = true;


          /*
          Do NOT play/pause here.

          Wait for MindAR to detect the target.
          */

          console.log(
            "AR READY"
          );

        }
      );


      /*
      ==========================================
      TARGET FOUND
      ==========================================
      */

      target.addEventListener(
        "targetFound",
        async function () {

          console.log(
            "TARGET FOUND"
          );


          if (!arStarted) {

            return;

          }


          /*
          Update status
          */

          status.textContent =
            "✓ AR detected";


          /*
          ========================================
          RESET VIDEO
          ========================================
          */

          try {

            /*
            Stop current playback
            */

            video.pause();


            /*
            Start from beginning
            */

            video.currentTime = 0;


            /*
            ======================================
            PLAY
            ======================================
            */

            await video.play();


            console.log(
              "VIDEO PLAYING"
            );


          } catch (error) {

            console.error(
              "VIDEO PLAY ERROR:",
              error
            );

          }

        }
      );


      /*
      ==========================================
      TARGET LOST
      ==========================================
      */

      target.addEventListener(
        "targetLost",
        function () {

          console.log(
            "TARGET LOST"
          );


          /*
          Update status
          */

          status.textContent =
            "Point your camera at the card";


          /*
          Pause video.

          DO NOT unload it.
          DO NOT change the A-Frame src.
          */

          video.pause();


          console.log(
            "VIDEO PAUSED"
          );

        }
      );


      /*
      ==========================================
      VIDEO DEBUGGING
      ==========================================
      */

      video.addEventListener(
        "loadeddata",
        function () {

          console.log(
            "VIDEO LOADED"
          );

        }
      );


      video.addEventListener(
        "canplay",
        function () {

          console.log(
            "VIDEO CAN PLAY"
          );

        }
      );


      video.addEventListener(
        "playing",
        function () {

          console.log(
            "VIDEO PLAYING EVENT"
          );

        }
      );


      video.addEventListener(
        "pause",
        function () {

          console.log(
            "VIDEO PAUSED EVENT"
          );

        }
      );


      video.addEventListener(
        "error",
        function () {

          console.error(
            "VIDEO ERROR:",
            video.error
          );

        }
      );

    </script>

  </body>
</html>
