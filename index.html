<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebAR Video</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }

        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 30px;

            background: #111;
            color: white;

            text-align: center;
        }

        #startScreen h1 {
            margin-bottom: 10px;
        }

        #startScreen p {
            max-width: 400px;
            line-height: 1.5;
            opacity: 0.8;
        }

        #startButton {
            margin-top: 20px;

            padding: 15px 30px;

            border: 0;
            border-radius: 10px;

            background: white;
            color: #111;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 500;

            padding: 10px 16px;

            border-radius: 30px;

            background: rgba(0, 0, 0, 0.7);
            color: white;

            font-size: 14px;

            display: none;
        }

        #videoControls {
            position: fixed;

            left: 50%;
            bottom: 30px;

            transform: translateX(-50%);

            z-index: 500;

            display: none;

            gap: 10px;
        }

        #videoControls button {
            border: 0;

            padding: 12px 18px;

            border-radius: 30px;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            cursor: pointer;
        }

        a-scene {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <!-- START SCREEN -->

    <div id="startScreen">

        <h1>✨ AR Experience</h1>

        <p>
            Tap the button below and point your camera
            at the AR image.
        </p>

        <button id="startButton">
            Start AR
        </button>

    </div>


    <!-- STATUS -->

    <div id="status">
        Point your camera at the image
    </div>


    <!-- VIDEO CONTROLS -->

    <div id="videoControls">

        <button id="playButton">
            ▶ Play
        </button>

        <button id="pauseButton">
            ⏸ Pause
        </button>

    </div>


    <!-- VIDEO -->

    <video
        id="arVideo"

        src="video.mp4"

        playsinline
        webkit-playsinline

        muted

        loop

        crossorigin="anonymous"

        preload="auto"
    ></video>


    <!-- AR SCENE -->

    <a-scene

        mindar-image="
            imageTargetSrc: target.mind;
            autoStart: false;
            uiScanning: false;
            uiLoading: false;
        "

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="
            enabled: false
        "

    >

        <a-assets>

            <video
                id="videoAsset"

                src="video.mp4"

                playsinline
                webkit-playsinline

                muted

                loop

                crossorigin="anonymous"
            ></video>

        </a-assets>


        <!-- CAMERA -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>


        <!-- IMAGE TARGET -->

        <a-entity
            id="target"
            mindar-image-target="targetIndex: 0"
        >

            <!-- VIDEO -->

            <a-video

                id="videoPlane"

                src="#videoAsset"

                position="0 0 0"

                width="1"

                height="0.5625"

                material="
                    shader: flat;
                    side: double;
                "

            ></a-video>

        </a-entity>

    </a-scene>


    <script>

        const scene =
            document.querySelector("a-scene");

        const startScreen =
            document.getElementById("startScreen");

        const startButton =
            document.getElementById("startButton");

        const status =
            document.getElementById("status");

        const target =
            document.getElementById("target");

        const video =
            document.getElementById("videoAsset");

        const videoControls =
            document.getElementById("videoControls");

        const playButton =
            document.getElementById("playButton");

        const pauseButton =
            document.getElementById("pauseButton");


        /*
         * START AR
         */

        startButton.addEventListener(
            "click",
            async () => {

                try {

                    startScreen.style.display =
                        "none";

                    status.style.display =
                        "block";

                    status.textContent =
                        "Starting camera...";


                    const arSystem =
                        scene.systems[
                            "mindar-image-system"
                        ];


                    await arSystem.start();


                    status.textContent =
                        "Point your camera at the image";


                } catch (error) {

                    console.error(error);

                    status.textContent =
                        "Unable to start camera.";

                }

            }
        );


        /*
         * TARGET FOUND
         */

        target.addEventListener(
            "targetFound",
            () => {

                console.log(
                    "AR TARGET FOUND"
                );


                status.textContent =
                    "✓ AR detected";


                videoControls.style.display =
                    "flex";


                /*
                 * Attempt autoplay.
                 *
                 * Because the user already
                 * interacted with the Start
                 * button, this normally works.
                 */

                video.play().catch(
                    error => {

                        console.log(
                            "Autoplay prevented:",
                            error
                        );

                    }
                );

            }
        );


        /*
         * TARGET LOST
         */

        target.addEventListener(
            "targetLost",
            () => {

                console.log(
                    "AR TARGET LOST"
                );


                status.textContent =
                    "Point your camera at the image";


                video.pause();

            }
        );


        /*
         * PLAY
         */

        playButton.addEventListener(
            "click",
            () => {

                video.play();

            }
        );


        /*
         * PAUSE
         */

        pauseButton.addEventListener(
            "click",
            () => {

                video.pause();

            }
        );

    </script>

</body>
</html>
