<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #arPage {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        padding: 30px;

        background: #111;
        color: white;

        text-align: center;
        font-family: Arial, sans-serif;
      }

      #arPage h1 {
        margin: 0 0 10px;
        font-size: 30px;
      }

      #arPage p {
        max-width: 320px;
        margin: 0 0 25px;
        line-height: 1.5;
        opacity: 0.75;
      }

      #startAR {
        padding: 16px 35px;

        border: none;
        border-radius: 50px;

        background: white;
        color: black;

        font-size: 17px;
        font-weight: bold;

        cursor: pointer;
      }

      #status {
        position: fixed;
        z-index: 9998;

        top: 20px;
        left: 50%;

        transform: translateX(-50%);

        padding: 10px 18px;

        border-radius: 30px;

        background: rgba(0, 0, 0, 0.7);
        color: white;

        font-family: Arial, sans-serif;
        font-size: 14px;

        display: none;
      }
    </style>
  </head>

  <body>
    <!-- ========================================
         AR LANDING PAGE
    ========================================= -->

    <div id="arPage">
      <h1>✨ AR Experience</h1>

      <p>Tap Start AR, then point your camera at the card.</p>

      <button id="startAR">Start AR</button>
    </div>

    <!-- STATUS -->

    <div id="status">Point your camera at the card</div>

    <!-- ========================================
         MINDAR
    ========================================= -->

    <a-scene
      mindar-image="
        imageTargetSrc:
        https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;
      "
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- ======================================
           ASSETS
      ======================================= -->

      <a-assets>
        <video
          id="arVideo"
          src="video.mp4"
          loop
          playsinline
          webkit-playsinline
          preload="auto"
        ></video>
      </a-assets>

      <!-- ======================================
           CAMERA
      ======================================= -->

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- ======================================
           IMAGE TARGET
      ======================================= -->

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <!-- ====================================
             3D POP-OUT CONTAINER
        ===================================== -->

        <a-entity
          id="popout"
          position="0 0 0"
          rotation="0 0 0"
          scale="0.15 0.15 0.15"
        >
          <!-- ==================================
               VIDEO SHADOW / BACK
          =================================== -->

          <a-plane
            id="videoShadow"
            position="0 0 -0.04"
            width="1.08"
            height="0.65"
            rotation="0 0 0"
            color="#000000"
            opacity="0.35"
          ></a-plane>

          <!-- ==================================
               VIDEO FRAME
          =================================== -->

          <a-box
            position="0 0 0"
            width="1.08"
            height="0.65"
            depth="0.06"
            color="#111111"
          ></a-box>

          <!-- ==================================
               VIDEO
          =================================== -->

          <a-video
            id="videoPlane"
            src="#arVideo"
            position="0 0 0.04"
            width="1"
            height="0.5625"
            material="
              shader: flat;
              side: double;
            "
          ></a-video>

          <!-- ==================================
               TOP EDGE
          =================================== -->

          <a-box
            position="0 0.325 0"
            width="1.08"
            height="0.025"
            depth="0.08"
            color="#db4a2b"
          ></a-box>

          <!-- ==================================
               BOTTOM EDGE
          =================================== -->

          <a-box
            position="0 -0.325 0"
            width="1.08"
            height="0.025"
            depth="0.08"
            color="#db4a2b"
          ></a-box>

          <!-- ==================================
               LEFT EDGE
          =================================== -->

          <a-box
            position="-0.54 0 0"
            width="0.025"
            height="0.65"
            depth="0.08"
            color="#db4a2b"
          ></a-box>

          <!-- ==================================
               RIGHT EDGE
          =================================== -->

          <a-box
            position="0.54 0 0"
            width="0.025"
            height="0.65"
            depth="0.08"
            color="#db4a2b"
          ></a-box>

          <!-- ==================================
               LIGHT
          =================================== -->

          <a-light
            type="point"
            position="0 0 0.5"
            intensity="1.5"
            distance="3"
          ></a-light>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      /*
      ==========================================
      ELEMENTS
      ==========================================
      */

      const arPage = document.getElementById("arPage");

      const startAR = document.getElementById("startAR");

      const status = document.getElementById("status");

      const video = document.getElementById("arVideo");

      const target = document.getElementById("target");

      const popout = document.getElementById("popout");

      /*
      ==========================================
      START AR
      ==========================================
      */

      startAR.addEventListener("click", async function () {
        console.log("START AR BUTTON");

        arPage.style.display = "none";

        status.style.display = "block";

        status.textContent = "Point your camera at the card";

        video.muted = false;

        /*
          Prepare video
          */

        try {
          await video.play();

          video.pause();

          console.log("VIDEO READY");
        } catch (error) {
          console.log("Video preparation:", error);
        }
      });

      /*
      ==========================================
      TARGET FOUND
      ==========================================
      */

      target.addEventListener("targetFound", async function () {
        console.log("TARGET FOUND");

        status.textContent = "✓ AR detected";

        /*
          ======================================
          RESET POP-OUT
          ======================================
          */

        popout.setAttribute("position", "0 0 0.05");

        popout.setAttribute("rotation", "0 0 0");

        popout.setAttribute("scale", "0.15 0.15 0.15");

        /*
          ======================================
          SCALE UP
          ======================================
          */

        popout.setAttribute("animation__scale", {
          property: "scale",
          from: "0.15 0.15 0.15",
          to: "1 1 1",

          dur: 900,

          easing: "easeOutCubic",
        });

        /*
          ======================================
          MOVE OUT OF CARD
          ======================================
          */

        popout.setAttribute("animation__move", {
          property: "position",

          from: "0 0 0.05",

          to: "0 0.20 0.75",

          dur: 900,

          easing: "easeOutCubic",
        });

        /*
          ======================================
          ROTATE SLIGHTLY
          ======================================
          */

        popout.setAttribute("animation__rotate", {
          property: "rotation",

          from: "0 0 0",

          to: "-8 -12 0",

          dur: 900,

          easing: "easeOutCubic",
        });

        /*
          ======================================
          PLAY VIDEO
          ======================================
          */

        video.muted = false;

        try {
          await video.play();

          console.log("VIDEO PLAYING");
        } catch (error) {
          console.error("VIDEO PLAY ERROR:", error);
        }
      });

      /*
      ==========================================
      TARGET LOST
      ==========================================
      */

      target.addEventListener("targetLost", function () {
        console.log("TARGET LOST");

        status.textContent = "Point your camera at the card";

        video.pause();

        /*
          Return video to card
          */

        popout.setAttribute("animation__return", {
          property: "position",

          from: "0 0.20 0.75",

          to: "0 0 0.05",

          dur: 400,

          easing: "easeInCubic",
        });

        popout.setAttribute("animation__returnScale", {
          property: "scale",

          from: "1 1 1",

          to: "0.15 0.15 0.15",

          dur: 400,

          easing: "easeInCubic",
        });
      });
    </script>
  </body>
</html>
