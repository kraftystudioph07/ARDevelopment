<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #soundButton {
      position: fixed;
      z-index: 9999;

      bottom: 30px;
      left: 50%;

      transform: translateX(-50%);

      padding: 14px 22px;

      border: none;
      border-radius: 30px;

      background: rgba(0, 0, 0, 0.75);
      color: white;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      display: none;
    }

  </style>

</head>


<body>


  <!-- SOUND BUTTON -->

  <button id="soundButton">
    🔇 Tap for Sound
  </button>


  <a-scene

    mindar-image="
      imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true,
      physicallyCorrectLights
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="
      enabled: false
    "

  >


    <a-assets>


      <!-- VIDEO -->

      <video

        id="arVideo"

        src="video.mp4"

        autoplay

        muted

        loop

        playsinline

        webkit-playsinline

        preload="auto"

      ></video>


    </a-assets>


    <!-- CAMERA -->

    <a-camera

      position="0 0 0"

      look-controls="enabled: false"

    ></a-camera>


    <!-- IMAGE TARGET -->

    <a-entity

      id="target"

      mindar-image-target="
        targetIndex: 0
      "

    >


      <!-- VIDEO -->

      <a-video

        src="#arVideo"

        position="0 0 0.1"

        width="1"

        height="0.5625"

        material="
          shader: flat;
          side: double;
        "

      ></a-video>


    </a-entity>


  </a-scene>


  <script>


    const video =
      document.getElementById(
        "arVideo"
      );


    const target =
      document.getElementById(
        "target"
      );


    const soundButton =
      document.getElementById(
        "soundButton"
      );


    /*
     * TARGET FOUND
     */

    target.addEventListener(
      "targetFound",
      async function () {

        console.log(
          "TARGET FOUND"
        );


        /*
         * Show sound button
         */

        soundButton.style.display =
          "block";


        /*
         * Make sure video
         * starts from the beginning
         */

        video.currentTime = 0;


        /*
         * Autoplay muted
         */

        video.muted = true;


        try {

          await video.play();

          console.log(
            "VIDEO AUTOPLAY STARTED"
          );

        } catch (error) {

          console.log(
            "Autoplay blocked:",
            error
          );

        }

      }
    );


    /*
     * TARGET LOST
     */

    target.addEventListener(
      "targetLost",
      function () {

        console.log(
          "TARGET LOST"
        );


        video.pause();


        soundButton.style.display =
          "none";

      }
    );


    /*
     * SOUND BUTTON
     */

    soundButton.addEventListener(
      "click",
      async function () {

        try {

          if (video.muted) {

            video.muted = false;

            await video.play();

            soundButton.textContent =
              "🔊 Sound On";

          } else {

            video.muted = true;

            soundButton.textContent =
              "🔇 Tap for Sound";

          }

        } catch (error) {

          console.error(
            "Sound error:",
            error
          );

        }

      }
    );


  </script>


</body>

</html>
