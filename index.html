<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AR Experience</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        font-family: Arial, sans-serif;

        background: #111;
      }

      /*
    ==========================================
    AR LANDING PAGE
    ==========================================
    */

      #arPage {
        position: fixed;

        inset: 0;

        z-index: 10000;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        padding: 30px;

        text-align: center;

        background: #111;

        color: white;
      }

      #arPage .icon {
        width: 90px;

        height: 90px;

        display: flex;

        align-items: center;

        justify-content: center;

        margin-bottom: 25px;

        border-radius: 24px;

        background: #222;

        font-size: 42px;
      }

      #arPage h1 {
        margin: 0 0 12px;

        font-size: 30px;
      }

      #arPage p {
        max-width: 340px;

        margin: 0 0 30px;

        line-height: 1.6;

        color: rgba(255, 255, 255, 0.7);
      }

      #startAR {
        min-width: 180px;

        padding: 16px 30px;

        border: none;

        border-radius: 50px;

        background: white;

        color: #111;

        font-size: 17px;

        font-weight: bold;

        cursor: pointer;
      }

      #startAR:active {
        transform: scale(0.97);
      }

      /*
    ==========================================
    INSTRUCTIONS
    ==========================================
    */

      #instructions {
        display: none;

        position: fixed;

        z-index: 9998;

        top: 20px;

        left: 50%;

        transform: translateX(-50%);

        width: calc(100% - 40px);

        max-width: 400px;

        padding: 13px 18px;

        border-radius: 30px;

        background: rgba(0, 0, 0, 0.75);

        color: white;

        text-align: center;

        font-size: 14px;
      }

      /*
    ==========================================
    LOADING
    ==========================================
    */

      #loading {
        display: none;

        position: fixed;

        inset: 0;

        z-index: 10001;

        align-items: center;

        justify-content: center;

        background: #111;

        color: white;

        text-align: center;
      }

      /*
    ==========================================
    A-FRAME
    ==========================================
    */

      a-scene {
        width: 100%;

        height: 100%;
      }
    </style>
  </head>

  <body>
    <!--
================================================
AR LANDING PAGE
================================================
-->

    <div id="arPage">
      <div class="icon">✨</div>

      <h1>AR Experience</h1>

      <p>
        Bring your card to life. Tap the button below and point your camera at
        the card.
      </p>

      <button id="startAR">Start AR</button>
    </div>

    <!--
================================================
AR INSTRUCTIONS
================================================
-->

    <div id="instructions">Point your camera at the card</div>

    <!--
================================================
AR SCENE
================================================
-->

    <a-scene
      mindar-image="
    imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;
  "
      color-space="sRGB"
      renderer="
    colorManagement: true,
    physicallyCorrectLights
  "
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="
    enabled: false
  "
    >
      <!--
  ==============================================
  ASSETS
  ==============================================
  -->

      <a-assets>
        <video
          id="arVideo"
          src="video.mp4"
          loop
          playsinline
          webkit-playsinline
          preload="auto"
        ></video>
      </a-assets>

      <!--
  ==============================================
  CAMERA
  ==============================================
  -->

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!--
  ==============================================
  IMAGE TARGET
  ==============================================
  -->

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <!--
    ============================================
    VIDEO
    ============================================
    -->

        <a-video
          src="#arVideo"
          position="0 0 0.1"
          width="1"
          height="0.5625"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      /*
================================================
ELEMENTS
================================================
*/

      const arPage = document.getElementById("arPage");

      const startAR = document.getElementById("startAR");

      const instructions = document.getElementById("instructions");

      const target = document.getElementById("target");

      const video = document.getElementById("arVideo");

      /*
================================================
START AR
================================================
*/

      startAR.addEventListener("click", async function () {
        console.log("START AR");

        /*
         * Hide landing page
         */

        arPage.style.display = "none";

        /*
         * Show instructions
         */

        instructions.style.display = "block";

        /*
         * Enable sound
         */

        video.muted = false;

        /*
         * Load video
         */

        video.load();

        /*
         * The user has interacted with
         * the page, so try to unlock
         * video playback.
         */

        try {
          await video.play();

          /*
           * Pause it again.
           *
           * This prepares the browser
           * for playback when the AR
           * target is detected.
           */

          video.pause();

          console.log("VIDEO READY");
        } catch (error) {
          console.log("Video preparation:", error);
        }
      });

      /*
================================================
TARGET FOUND
================================================
*/

      target.addEventListener("targetFound", async function () {
        console.log("TARGET FOUND");

        instructions.textContent = "✓ AR detected";

        /*
         * Make sure sound is enabled
         */

        video.muted = false;

        /*
         * Play video
         */

        try {
          await video.play();

          console.log("VIDEO PLAYING");
        } catch (error) {
          console.error("VIDEO PLAY ERROR:", error);
        }
      });

      /*
================================================
TARGET LOST
================================================
*/

      target.addEventListener("targetLost", function () {
        console.log("TARGET LOST");

        instructions.textContent = "Point your camera at the card";

        /*
         * Pause video
         */

        video.pause();
      });
    </script>
  </body>
</html>
