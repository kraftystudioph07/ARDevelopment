<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body>

    <a-scene
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <a-assets>

        <!-- Target image -->
        <img
          id="card"
          src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png"
        />

        <!-- Video -->
        <video
          id="arVideo"
          src="video.mp4"
          loop
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>

      </a-assets>


      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
      ></a-camera>


      <a-entity
        mindar-image-target="targetIndex: 0"
      >

        <!-- Card -->
        <a-plane
          src="#card"
          position="0 0 0"
          height="0.552"
          width="1"
          rotation="0 0 0"
        ></a-plane>


        <!-- VIDEO -->
        <a-video
          src="#arVideo"
          position="0 0 0.1"
          width="1"
          height="0.5625"
        ></a-video>

      </a-entity>

    </a-scene>


    <script>

      const target =
        document.querySelector(
          '[mindar-image-target]'
        );

      const video =
        document.querySelector(
          '#arVideo'
        );


      target.addEventListener(
        'targetFound',
        () => {

          console.log(
            'Target found'
          );

          video.play();

        }
      );


      target.addEventListener(
        'targetLost',
        () => {

          console.log(
            'Target lost'
          );

          video.pause();

        }
      );

    </script>

  </body>
</html>
