<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #arPage {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        padding: 30px;

        background: #111;
        color: white;

        text-align: center;
        font-family: Arial, sans-serif;
      }

      #arPage h1 {
        margin: 0 0 10px;
        font-size: 30px;
      }

      #arPage p {
        max-width: 320px;
        margin: 0 0 25px;
        line-height: 1.5;
        opacity: 0.75;
      }

      #startAR {
        padding: 16px 35px;

        border: none;
        border-radius: 50px;

        background: white;
        color: black;

        font-size: 17px;
        font-weight: bold;

        cursor: pointer;
      }

      #status {
        position: fixed;
        z-index: 9998;

        top: 20px;
        left: 50%;

        transform: translateX(-50%);

        padding: 10px 18px;

        border-radius: 30px;

        background: rgba(0, 0, 0, 0.7);

        color: white;

        font-family: Arial, sans-serif;
        font-size: 14px;

        display: none;
      }
    </style>
  </head>

  <body>

    <!-- AR PAGE -->

    <div id="arPage">
      <h1>✨ AR Experience</h1>

      <p>
        Tap Start AR, then point your camera at the card.
      </p>

      <button id="startAR">
        Start AR
      </button>
    </div>


    <!-- STATUS -->

    <div id="status">
      Point your camera at the card
    </div>


    <!-- MINDAR -->

    <a-scene
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <a-assets>

        <video
          id="arVideo"
          src="video.mp4"
          loop
          playsinline
          webkit-playsinline
          preload="auto"
        ></video>

      </a-assets>


      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
      ></a-camera>


      <a-entity
        id="target"
        mindar-image-target="targetIndex: 0"
      >

        <a-video
          id="videoPlane"
          src="#arVideo"
          position="0 0 0.1"
          width="1"
          height="0.5625"
        ></a-video>

      </a-entity>

    </a-scene>


    <script>

      /*
      ==========================================
      ELEMENTS
      ==========================================
      */

      const arPage =
        document.getElementById("arPage");

      const startAR =
        document.getElementById("startAR");

      const status =
        document.getElementById("status");

      const video =
        document.getElementById("arVideo");

      const target =
        document.getElementById("target");

      const videoPlane =
        document.getElementById("videoPlane");


      /*
      ==========================================
      STATE
      ==========================================
      */

      let arStarted = false;


      /*
      ==========================================
      START AR
      ==========================================
      */

      startAR.addEventListener(
        "click",
        async function () {

          console.log(
            "START AR BUTTON"
          );


          arStarted = true;


          /*
          Hide landing page
          */

          arPage.style.display = "none";


          /*
          Show status
          */

          status.style.display = "block";

          status.textContent =
            "Point your camera at the card";


          /*
          ========================================
          IMPORTANT
          ========================================

          We DON'T play/pause here anymore.

          We only unlock the video through
          the user's interaction.
          */

          video.muted = true;

          try {

            await video.play();

            console.log(
              "VIDEO UNLOCKED"
            );

          } catch (error) {

            console.log(
              "VIDEO UNLOCK:",
              error
            );

          }

          /*
          Pause after unlocking.

          The actual playback happens when
          MindAR finds the target.
          */

          video.pause();

        }
      );


      /*
      ==========================================
      FORCE VIDEO TEXTURE UPDATE
      ==========================================
      */

      function refreshVideoTexture() {

        if (
          !videoPlane ||
          !videoPlane.components
        ) {

          return;

        }


        const materialComponent =
          videoPlane.components.material;


        if (
          materialComponent &&
          materialComponent.material
        ) {

          const material =
            materialComponent.material;


          /*
          Tell Three.js that the texture
          needs to update.
          */

          if (material.map) {

            material.map.needsUpdate = true;

          }


          material.needsUpdate = true;

        }

      }


      /*
      ==========================================
      TARGET FOUND
      ==========================================
      */

      target.addEventListener(
        "targetFound",
        async function () {

          console.log(
            "TARGET FOUND"
          );


          if (!arStarted) {

            return;

          }


          status.textContent =
            "✓ AR detected";


          /*
          ========================================
          REFRESH TEXTURE
          ========================================
          */

          refreshVideoTexture();


          /*
          ========================================
          PLAY VIDEO
          ========================================
          */

          video.muted = false;


          try {

            /*
            Give the browser one rendering
            cycle before playing.
            */

            await new Promise(
              function (resolve) {

                requestAnimationFrame(
                  resolve
                );

              }
            );


            await video.play();


            /*
            Force another texture update
            after playback starts.
            */

            refreshVideoTexture();


            console.log(
              "VIDEO PLAYING"
            );


          } catch (error) {

            console.error(
              "VIDEO PLAY ERROR:",
              error
            );

          }

        }
      );


      /*
      ==========================================
      TARGET LOST
      ==========================================
      */

      target.addEventListener(
        "targetLost",
        function () {

          console.log(
            "TARGET LOST"
          );


          status.textContent =
            "Point your camera at the card";


          /*
          Pause only.

          DO NOT:
          - load()
          - change src
          - remove video
          - recreate a-video
          - reset currentTime
          */

          video.pause();


          console.log(
            "VIDEO PAUSED"
          );

        }
      );


      /*
      ==========================================
      VIDEO DEBUG
      ==========================================
      */

      video.addEventListener(
        "playing",
        function () {

          console.log(
            "VIDEO PLAYING EVENT"
          );

        }
      );


      video.addEventListener(
        "pause",
        function () {

          console.log(
            "VIDEO PAUSED EVENT"
          );

        }
      );


      video.addEventListener(
        "error",
        function () {

          console.error(
            "VIDEO ERROR:",
            video.error
          );

        }
      );

    </script>

  </body>
</html>
