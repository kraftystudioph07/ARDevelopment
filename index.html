<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /*
      ==========================================
      AR LANDING PAGE
      ==========================================
      */

      #arPage {
        position: fixed;

        inset: 0;

        z-index: 9999;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        padding: 30px;

        background: #111;

        color: white;

        text-align: center;

        font-family: Arial, sans-serif;
      }

      #arPage h1 {
        margin: 0 0 10px;

        font-size: 30px;
      }

      #arPage p {
        max-width: 320px;

        margin: 0 0 25px;

        line-height: 1.5;

        opacity: 0.75;
      }

      #startAR {
        padding: 16px 35px;

        border: none;

        border-radius: 50px;

        background: white;

        color: black;

        font-size: 17px;

        font-weight: bold;

        cursor: pointer;
      }

      /*
      ==========================================
      STATUS
      ==========================================
      */

      #status {
        position: fixed;

        z-index: 9998;

        top: 20px;

        left: 50%;

        transform: translateX(-50%);

        padding: 10px 18px;

        border-radius: 30px;

        background: rgba(0, 0, 0, 0.7);

        color: white;

        font-family: Arial, sans-serif;

        font-size: 14px;

        display: none;
      }
    </style>
  </head>

  <body>
    <!--
    ================================================
    AR PAGE
    ================================================
    -->

    <div id="arPage">
      <h1>✨ AR Experience</h1>

      <p>Tap Start AR, then point your camera at the card.</p>

      <button id="startAR">Start AR</button>
    </div>

    <!-- STATUS -->

    <div id="status">Point your camera at the card</div>

    <!--
    ================================================
    MINDAR
    ================================================
    -->

    <a-scene
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="arVideo"
          src="video.mp4"
          loop
          playsinline
          webkit-playsinline
          preload="auto"
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-video
          id="videoPlane"
          src="#arVideo"
          position="0 0 0.1"
          width="1"
          height="0.5625"
        ></a-video>
      </a-entity>
    </a-scene>

    <script>
      /*
      =================================================
      ELEMENTS
      =================================================
      */

      const arPage = document.getElementById("arPage");

      const startAR = document.getElementById("startAR");

      const status = document.getElementById("status");

      const video = document.getElementById("arVideo");

      const target = document.getElementById("target");

      const videoPlane = document.getElementById("videoPlane");

      /*
      =================================================
      STATE
      =================================================
      */

      let arStarted = false;

      let targetVisible = false;

      /*
      =================================================
      START AR
      =================================================
      */

      startAR.addEventListener("click", async function () {
        console.log("START AR BUTTON");

        /*
          Hide landing page
          */

        arPage.style.display = "none";

        /*
          Show status
          */

        status.style.display = "block";

        status.textContent = "Point your camera at the card";

        arStarted = true;

        /*
          IMPORTANT:
          Do NOT play then immediately pause
          the video here.

          That was one of the things that could
          leave the WebGL video texture in a bad
          state on the next target detection.
          */

        video.muted = true;

        video.pause();

        console.log("AR READY");
      });

      /*
      =================================================
      WAIT FOR VIDEO
      =================================================
      */

      function waitForVideo() {
        return new Promise(function (resolve) {
          /*
          Video already has enough data
          */

          if (video.readyState >= 2) {
            resolve();

            return;
          }

          /*
          Wait for video data
          */

          const loadedHandler = function () {
            video.removeEventListener("loadeddata", loadedHandler);

            resolve();
          };

          video.addEventListener("loadeddata", loadedHandler);
        });
      }

      /*
      =================================================
      REFRESH A-FRAME VIDEO
      =================================================
      */

      async function refreshVideo() {
        console.log("Refreshing video...");

        /*
        Pause
        */

        video.pause();

        /*
        Reset playback position
        */

        try {
          video.currentTime = 0;
        } catch (error) {
          console.log("Could not reset video:", error);
        }

        /*
        Wait until video has data
        */

        await waitForVideo();

        /*
        Tell A-Frame to use the video
        again as its material source.
        */

        videoPlane.setAttribute("src", "");

        /*
        Small delay allows A-Frame's
        material to release the old
        texture.
        */

        await new Promise(function (resolve) {
          setTimeout(resolve, 50);
        });

        /*
        Reconnect video
        */

        videoPlane.setAttribute("src", "#arVideo");

        console.log("Video texture refreshed");
      }

      /*
      =================================================
      TARGET FOUND
      =================================================
      */

      target.addEventListener("targetFound", async function () {
        console.log("TARGET FOUND");

        targetVisible = true;

        status.textContent = "✓ AR detected";

        if (!arStarted) {
          return;
        }

        /*
          Refresh the video every time
          the target is detected.

          This is what fixes the white
          video on the second detection.
          */

        try {
          await refreshVideo();

          /*
            =========================================
            PLAY VIDEO
            =========================================
            */

          video.muted = false;

          await video.play();

          console.log("VIDEO PLAYING");
        } catch (error) {
          console.error("VIDEO PLAY ERROR:", error);

          /*
            =========================================
            FALLBACK
            =========================================

            If the browser refuses sound,
            play muted.
            */

          try {
            video.muted = true;

            await video.play();

            console.log("VIDEO PLAYING MUTED");
          } catch (fallbackError) {
            console.error("VIDEO FALLBACK ERROR:", fallbackError);
          }
        }
      });

      /*
      =================================================
      TARGET LOST
      =================================================
      */

      target.addEventListener("targetLost", function () {
        console.log("TARGET LOST");

        targetVisible = false;

        status.textContent = "Point your camera at the card";

        /*
          Pause video.

          IMPORTANT:
          We do NOT call video.load()
          or remove the source here.

          MindAR continues tracking normally.
          */

        video.pause();

        console.log("VIDEO PAUSED");
      });

      /*
      =================================================
      VIDEO ERROR DEBUGGING
      =================================================
      */

      video.addEventListener("error", function () {
        console.error("VIDEO ERROR:", video.error);
      });

      /*
      =================================================
      VIDEO EVENTS
      =================================================
      */

      video.addEventListener("loadeddata", function () {
        console.log("VIDEO DATA LOADED");
      });

      video.addEventListener("canplay", function () {
        console.log("VIDEO CAN PLAY");
      });

      video.addEventListener("playing", function () {
        console.log("VIDEO PLAYING EVENT");
      });
    </script>
  </body>
</html>
